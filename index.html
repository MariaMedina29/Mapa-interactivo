<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla Sodimac</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
    <link rel="stylesheet" href="https://use.typekit.net/hmu6tii.css">
</head>
<body>
    <div class="circle" style="bottom: -50%; height: 100%; width:150%";></div>
    <div class="container">
        <div class="card " style="width: 50% ; ">
            <div class="card-content">
                <div class="logo-container">
                    <img src="Img/Logo sodimac.png" alt="Sodimac Corona" class="logo">
                    <p class="text">
                        Somos una empresa líder en el mercado del mejoramiento del hogar, con una amplia gama de productos y excelencia en el servicio. Por eso, queremos que conozcas todas nuestras tiendas y en dónde podrás encontrarnos.
                    </p>
                    <button class="btn">COLOMBIA</button>
                </div>
            </div>
        
            <div class="bottom-container">
                <img src="Img/Franco.png" alt="Franco" class="Franco">
            </div>
        </div>
        
    </div>

    <footer>
        <div class="Chatbot">
            <p>Volver al chatbot</p>
            <img src="Img/Franco_Idel.png" alt="Return" class="ChatFranco">
        </div>
    </footer>
    

</body>
</html>

<style>
    .card {
        height: 75%;
      }
    @media (max-width: 940px) {
      .card {
        height: 60%;
      }
    }
</style>
